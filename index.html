<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Mood Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <header>
      <h1>📊 Crypto Mood Dashboard</h1>
      <p>Live market vibe & simple analytics UI</p>
    </header>

    <div class="grid">

      <div class="card">
        <h3>Bitcoin</h3>
        <p id="btc">$0</p>
        <span>+2.4% today</span>
      </div>

      <div class="card">
        <h3>Ethereum</h3>
        <p id="eth">$0</p>
        <span>-1.2% today</span>
      </div>

      <div class="card mood">
        <h3>Market Mood</h3>
        <p id="mood">Neutral</p>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
